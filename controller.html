<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SF-Controller</title>
<meta name="apple-mobile-web-app-title" content="SF-Controller">
<meta name="application-name" content="SF-Controller">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="ctl-icon-180.png">
<link rel="icon" type="image/png" href="ctl-icon-192.png">
<link rel="manifest" href="controller-manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Press Start 2P',monospace;color:#fff}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;--w:100vw;--h:100vh;--m:100vmin}
#bg{position:absolute;inset:0;background:#000 url(title.jpg) center/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
#top{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));text-align:center;z-index:3;pointer-events:none}
#who{font-size:14px;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8)}
#who.p1{color:#5ac8ff}#who.p2{color:#ff7a6a}
#st{margin-top:8px;font-size:8px;color:#d8c8a8;text-shadow:0 1px 0 #000}
#st.ok{color:#5ae06a}#st.bad{color:#ff5a4a}
#stickZone{position:absolute;left:0;top:0;bottom:0;width:50%;z-index:2}
#stick{--s:min(170px,calc(var(--m)*.42));position:absolute;left:calc(calc(var(--w)*.06) + env(safe-area-inset-left));bottom:calc(var(--h)*.08);width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);box-sizing:border-box}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.5);box-sizing:border-box}
#btnZone{position:absolute;right:0;top:0;bottom:0;width:50%;z-index:2}
#btns{--b:min(78px,calc(var(--m)*.19));position:absolute;right:calc(calc(var(--w)*.06) + env(safe-area-inset-right));bottom:calc(var(--h)*.07);width:calc(var(--b)*2.9);height:calc(var(--b)*2.9)}
.b{position:absolute;width:var(--b);height:var(--b);border-radius:50%;box-sizing:border-box;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font-size:calc(var(--b)*.28);display:flex;flex-direction:column;align-items:center;justify-content:center}
.b small{font-size:calc(var(--b)*.1);margin-top:5px;opacity:.8}
.b.on{transform:scale(.92);background:rgba(255,255,255,.3)}
.bx{left:calc(var(--b)*.95);top:0;border-color:#4696ff}
.by{left:0;top:calc(var(--b)*.95);border-color:#ffd63c}
.ba{left:calc(var(--b)*1.9);top:calc(var(--b)*.95);border-color:#5adc6e}
.bb{left:calc(var(--b)*.95);top:calc(var(--b)*1.9);border-color:#ff5050}
#start{position:absolute;left:50%;bottom:calc(calc(var(--h)*.05) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;padding:9px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);font-size:9px;color:rgba(255,255,255,.85)}
#start.on{background:rgba(255,255,255,.3)}
#fig{position:absolute;left:50%;top:calc(var(--h)*.2);transform:translateX(-50%);z-index:1;display:none;flex-direction:column;align-items:center;pointer-events:none}
#fig .pic{position:relative;width:calc(var(--m)*.38);height:calc(var(--m)*.38);border:3px solid #5ac8ff;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 18px rgba(90,200,255,.45)}
#fig.p2 .pic{border-color:#ff7a6a;box-shadow:0 0 18px rgba(255,122,106,.45)}
#fig img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
#fig .nm{margin-top:8px;font-size:10px;text-shadow:0 2px 0 #000}
#fig .hp{margin-top:6px;width:calc(var(--m)*.38);height:6px;background:#3a2e44;border-radius:3px;overflow:hidden}
#fig .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6a1a,#ffd23a);transition:width .2s}
#fig .res{display:none;margin-top:8px;font-size:15px;text-shadow:0 3px 0 #000,0 0 12px rgba(0,0,0,.8)}
#fig.win .res{display:block;color:#ffd23a;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#fig.lose .res{display:block;color:#ff5a4a;animation:pop .45s ease-out}
#fig.win .hp,#fig.lose .hp{display:none}
#fig.win .pic{border-color:#ffd23a;box-shadow:0 0 26px rgba(255,210,58,.8)}
#fig.lose .pic{border-color:#7a2a2a;box-shadow:none}
#fig.lose img{filter:saturate(.6)}
@keyframes pop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
#connect{position:absolute;left:50%;top:calc(var(--h)*.42);transform:translate(-50%,-50%);z-index:5;display:none;padding:16px 26px;border-radius:16px;border:3px solid #ffd23a;background:rgba(14,8,22,.85);color:#ffd23a;font-size:14px;box-shadow:0 0 22px rgba(255,210,58,.45);animation:glow 1.6s ease-in-out infinite}
#connect.on{transform:translate(-50%,-50%) scale(.94);background:rgba(255,210,58,.25)}
@keyframes glow{50%{box-shadow:0 0 6px rgba(255,210,58,.2)}}
#cnote{position:absolute;left:50%;top:calc(var(--h)*.42 + 40px);transform:translateX(-50%);z-index:5;display:none;font-size:8px;color:#fff;white-space:nowrap;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);pointer-events:none}
#inst{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:4;display:none;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);font-size:7px;color:rgba(255,255,255,.9)}
#inst svg{width:14px;height:14px}
#help{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}
#help div{background:#0e0816;border-radius:10px;padding:18px 22px;max-width:80%;text-align:center;font-size:8px;line-height:2;color:#fff}
#help b{color:#ffd23a;font-weight:normal;display:block;margin-bottom:8px}
#help svg{width:14px;height:14px;vertical-align:-3px}
</style>
</head>
<body>
<div id="app">
<div id="bg"></div>
<div id="top"><div id="who">PLAYER 1</div><div id="st">CONNECTING...</div></div>
<div id="fig"><div class="pic"><img alt=""></div><div class="nm"></div><div class="hp"><i></i></div><div class="res"></div></div>
<div id="connect">CONNECT</div>
<div id="cnote">USE SAME WI-FI</div>
<div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
<div id="btnZone"><div id="btns">
  <div class="b by" data-b="p">Y<small>PUNCH</small></div>
  <div class="b bx" data-b="x">X<small>COUNTER</small></div>
  <div class="b bb" data-b="k">B<small>KICK</small></div>
  <div class="b ba" data-b="s">A<small>SPECIAL</small></div>
</div></div>
<div id="start" data-b="start">START</div>
<div id="inst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg>INSTALL</div>
<div id="help"><div><b>ADD SF-CONTROLLER</b><span id="helpTxt"></span><br><br><span style="opacity:.5">TAP TO CLOSE</span></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
'use strict';
(() => {
  // l'identifiant du jeu est mémorisé : l'appli installée sur l'écran d'accueil se reconnecte seule
  const q = new URLSearchParams(location.search);
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('sfctl') || '{}'); } catch (e) {}
  const host = q.get('h') || saved.h || null, P = (q.get('p') || saved.p) === '2' ? 2 : 1;
  if (host) try { localStorage.setItem('sfctl', JSON.stringify({ h: host, p: String(P) })); } catch (e) {}
  const who = document.getElementById('who'), st = document.getElementById('st');
  who.textContent = 'PLAYER ' + P; who.className = 'p' + P;
  function wake() { try { if (navigator.wakeLock && !wake.lock) navigator.wakeLock.request('screen').then(l => { wake.lock = l; l.addEventListener('release', () => { wake.lock = null; }); }).catch(() => {}); } catch (e) {} }
  // Personnage choisi au milieu de la manette ; YOU WIN! / YOU LOSE... à la fin du combat
  const PICS = ['p_kaito', 'p_john', 'p_vesper', 'p_grog', 'p_zephyr', 'p_nyx', 'p_kael', 'p_vane'];
  const fig = document.getElementById('fig'), figImg = fig.querySelector('img'), figNm = fig.querySelector('.nm'), figHp = fig.querySelector('.hp i'), figRes = fig.querySelector('.res');
  let lastRes = null;
  function showState(m) {
    if (m.ch == null || !PICS[m.ch]) { fig.style.display = 'none'; lastRes = null; return; }
    fig.style.display = 'flex'; fig.classList.toggle('p2', P === 2);
    const hurt = m.res === 'lose' || (m.res == null && m.hp != null && m.hp <= 25);   // visage blessé : défaite, ou énergie presque vide
    const src = PICS[m.ch] + (hurt ? '_hurt' : '') + '.jpg?v=104';
    if (figImg.getAttribute('src') !== src) figImg.setAttribute('src', src);
    figNm.textContent = m.name || '';
    figHp.style.width = Math.max(0, Math.min(100, m.hp == null ? 100 : m.hp)) + '%';
    if (m.res !== lastRes) {
      fig.classList.remove('win', 'lose'); void fig.offsetWidth;   // relance l'animation
      if (m.res) { fig.classList.add(m.res); figRes.textContent = m.res === 'win' ? 'YOU WIN!' : 'YOU LOSE...'; if (navigator.vibrate) navigator.vibrate(m.res === 'win' ? [60, 40, 60] : 200); }
      lastRes = m.res;
    }
  }
  const state = { x: 0, y: 0 };                                   // stick (-1..1)
  const btn = { p: false, k: false, s: false, x: false, start: false };
  let conn = null, peer = null, ok = false, dirty = true;
  const setSt = (txt, cls) => { st.textContent = txt; st.className = cls || ''; };
  // message : x / y = stick ; p, k, s = boutons ; bx = contre (X) ; start
  function emit() {
    if (!ok) return;
    try { conn.send({ t: 'in', x: +state.x.toFixed(2), y: +state.y.toFixed(2), p: btn.p, k: btn.k, s: btn.s, bx: btn.x, start: btn.start }); } catch (e) {}
  }
  setInterval(() => { if (dirty || ok) { emit(); dirty = false; } }, 120);   // état régulier (au cas où un message se perd)
  const change = () => { dirty = true; emit(); };

  if (!host) { setSt('NO GAME ID - SCAN AGAIN', 'bad'); }
  else if (typeof Peer === 'undefined') { setSt('NETWORK LIBRARY MISSING', 'bad'); }
  else {
    // Connexion robuste : réessaie sans fin, détecte les coupures (battement de cœur du PC) et se reconnecte seule
    const ICE = { iceServers: [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:global.stun.twilio.com:3478'] },
      { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
    ] };
    let lastMsg = 0, retryT = null, tries = 0, parked = null, hidT = null;
    // Mise en veille : manette remplacée par une autre page (même joueur) ou page cachée depuis plus d'1 minute
    // Bouton CONNECT au milieu : seule la page où l'on appuie se connecte, les autres pages sont déconnectées
    const cbtn = document.getElementById('connect'), cnote = document.getElementById('cnote');
    const park = why => {
      parked = why; ok = false; clearTimeout(retryT); retryT = null;
      try { if (conn) conn.close(); } catch (_) {} try { if (peer) peer.destroy(); } catch (_) {} peer = null; conn = null;
      setSt(why === 'replaced' ? 'CONNECTED ON ANOTHER SCREEN' : why === 'idle' ? 'PAUSED' : 'PRESS CONNECT', why === 'start' ? '' : 'bad');
      cbtn.style.display = 'block'; cnote.style.display = 'block'; fig.style.display = 'none';
    };
    const unpark = () => { if (!parked) return; parked = null; tries = 0; cbtn.style.display = 'none'; cnote.style.display = 'none'; setSt('CONNECTING...'); newPeer(); };
    cbtn.addEventListener('pointerdown', e => { cbtn.classList.add('on'); e.stopPropagation(); e.preventDefault(); });
    cbtn.addEventListener('pointerup', e => { cbtn.classList.remove('on'); e.stopPropagation(); if (navigator.vibrate) navigator.vibrate(20); unpark(); });
    cbtn.addEventListener('pointercancel', () => cbtn.classList.remove('on'));
    const newPeer = () => {
      try { if (peer) peer.destroy(); } catch (_) {}
      if (parked) return;
      peer = new Peer({ config: ICE });
      peer.on('open', connect);
      peer.on('error', e => {
        if (parked) return; ok = false;
        setSt(e && e.type === 'peer-unavailable' ? 'WAITING FOR THE GAME...' : 'RECONNECTING...', 'bad');
        schedule();
      });
      peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (_) {} }, 1000); });
    };
    const schedule = (ms) => {   // nouvelle tentative (de plus en plus espacée, max 5 s)
      if (retryT || parked) return;
      retryT = setTimeout(() => { retryT = null; if (ok) return; if (!peer || peer.destroyed || peer.disconnected) newPeer(); else connect(); }, ms || Math.min(5000, 1000 + tries * 700));
    };
    const connect = () => {
      if (ok || parked || !peer) return;
      tries++;
      setSt('CONNECTING...');
      try { if (conn) conn.close(); } catch (_) {}
      const c = conn = peer.connect(host, { metadata: { p: P }, reliable: true });
      const t0 = setTimeout(() => { if (conn === c && !ok) schedule(10); }, 8000);   // pas de réponse : on réessaie
      c.on('open', () => { clearTimeout(t0); if (conn !== c) return; ok = true; tries = 0; lastMsg = Date.now(); setSt('CONNECTED', 'ok'); emit(); });
      c.on('data', m => { lastMsg = Date.now(); if (!m) return; if (m.t === 'bye') { park(m.why || 'replaced'); return; } if (m.t === 'st') showState(m); });
      c.on('close', () => { if (conn !== c || parked) return; ok = false; setSt('RECONNECTING...', 'bad'); schedule(); });
      c.on('error', () => { if (conn !== c) return; ok = false; schedule(); });
    };
    park('start');   // rien ne se connecte tant qu'on n'a pas appuyé sur CONNECT
    // le PC envoie un signal chaque seconde : sans nouvelles depuis 5 s, la manette se reconnecte
    setInterval(() => { if (!parked && ok && Date.now() - lastMsg > 5000) { ok = false; setSt('RECONNECTING...', 'bad'); try { conn.close(); } catch (_) {} schedule(10); } }, 1000);
    // retour sur la page (écran rallumé, appli rouverte) : reconnexion immédiate
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') { clearTimeout(hidT); hidT = setTimeout(() => { if (document.visibilityState !== 'visible' && !parked) park('idle'); }, 60000); return; }
      clearTimeout(hidT); wake();
      if (parked) return;   // en pause : on attend l'appui sur CONNECT
      if (!ok) { clearTimeout(retryT); retryT = null; schedule(10); }
    });
  }

  // Toujours en paysage : si le téléphone est tenu en portrait, toute la manette est tournée de 90°
  const app = document.getElementById('app'); let ROT = false;
  function layout() {
    let w = innerWidth, h = innerHeight;
    if (navigator.standalone && h > w) { w = Math.min(screen.width, screen.height); h = Math.max(screen.width, screen.height); }   // iPhone, rotation verrouillée
    ROT = h > w;
    const AW = ROT ? h : w, AH = ROT ? w : h;
    app.style.width = AW + 'px'; app.style.height = AH + 'px';
    app.style.setProperty('--w', AW + 'px'); app.style.setProperty('--h', AH + 'px'); app.style.setProperty('--m', Math.min(AW, AH) + 'px');
    app.style.transform = ROT ? `translateX(${w}px) rotate(90deg)` : 'none';
  }
  addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 100)); layout();
  // Android : plein écran + verrouillage en paysage au premier toucher (ignoré si le navigateur refuse)
  let locked = false;
  document.addEventListener('pointerup', e => {
    if (locked || (e.target.closest && e.target.closest('#inst,#help'))) return; locked = true;
    const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
    try { const p = fs && fs.call(d); const lock = () => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
      if (p && p.then) p.then(lock).catch(() => {}); else lock(); } catch (e) {}
  }, true);

  // Stick
  const zone = document.getElementById('stickZone'), stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null;
  const updStick = e => {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2;
    const sx = (e.clientX - cx) / R, sy = (e.clientY - cy) / R;
    let dx = ROT ? sy : sx, dy = ROT ? -sx : sy; const m = Math.hypot(dx, dy);   // manette tournée : axes échangés
    if (m > 1) { dx /= m; dy /= m; }
    state.x = dx; state.y = dy;
    knob.style.transform = `translate(calc(-50% + ${dx * R * .6}px), calc(-50% + ${dy * R * .6}px))`;
    change();
  };
  zone.addEventListener('pointerdown', e => { if (sid !== null) return; sid = e.pointerId; zone.setPointerCapture(sid); updStick(e); e.preventDefault(); });
  zone.addEventListener('pointermove', e => { if (e.pointerId === sid) updStick(e); });
  const endStick = e => { if (e.pointerId !== sid) return; sid = null; state.x = state.y = 0; knob.style.transform = 'translate(-50%,-50%)'; change(); };
  zone.addEventListener('pointerup', endStick); zone.addEventListener('pointercancel', endStick);

  // Boutons (glisser d'un bouton à l'autre possible)
  const bz = document.getElementById('btnZone'), owners = new Map();
  const pick = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest('.b') : null; };
  const refresh = () => {
    const now = { p: false, k: false, s: false, x: false };
    document.querySelectorAll('.b').forEach(b => b.classList.remove('on'));
    owners.forEach(el => { if (el) { now[el.dataset.b] = true; el.classList.add('on'); } });
    let changed = false;
    for (const k in now) { if (now[k] && !btn[k] && navigator.vibrate) navigator.vibrate(12); if (now[k] !== btn[k]) changed = true; btn[k] = now[k]; }
    if (changed) change();
  };
  bz.addEventListener('pointerdown', e => { bz.setPointerCapture(e.pointerId); owners.set(e.pointerId, pick(e)); refresh(); e.preventDefault(); });
  bz.addEventListener('pointermove', e => { if (owners.has(e.pointerId)) { owners.set(e.pointerId, pick(e)); refresh(); } });
  const bend = e => { owners.delete(e.pointerId); refresh(); };
  bz.addEventListener('pointerup', bend); bz.addEventListener('pointercancel', bend);
  const sb = document.getElementById('start');
  sb.addEventListener('pointerdown', e => { btn.start = true; sb.classList.add('on'); change(); e.preventDefault(); });
  const send0 = () => { btn.start = false; sb.classList.remove('on'); change(); };
  sb.addEventListener('pointerup', send0); sb.addEventListener('pointercancel', send0); sb.addEventListener('pointerleave', send0);

  // Installer la manette sur l'écran d'accueil (SF-Controller)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const inst = document.getElementById('inst'), help = document.getElementById('help');
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches && !document.fullscreenElement;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let ev = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; });
  addEventListener('appinstalled', () => { inst.style.display = 'none'; });
  if (!standalone) inst.style.display = 'flex';
  const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8H5v13h14V8h-3M12 15V3M8 7l4-4 4 4"/></svg>';
  inst.addEventListener('pointerup', e => {
    e.stopPropagation(); locked = true;   // pas de plein écran sur ce toucher
    if (ev) { ev.prompt(); ev = null; return; }
    document.getElementById('helpTxt').innerHTML = IOS ? '1. TAP SHARE ' + SHARE + '<br>2. ADD TO HOME SCREEN' : '1. OPEN THE BROWSER MENU<br>2. ADD TO HOME SCREEN';
    help.style.display = 'flex';
  });
  inst.addEventListener('pointerdown', e => e.stopPropagation());
  help.addEventListener('pointerup', () => { help.style.display = 'none'; });

  // garder l'écran allumé
  document.addEventListener('pointerdown', wake);   // l'écran reste allumé (redemandé à chaque retour sur la page)
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
