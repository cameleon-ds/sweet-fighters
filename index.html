<body>
<div id="app">
<canvas id="game" width="384" height="216"></canvas>

<div id="touch">
  <div id="stickZone">
    <div id="stick"><div id="knob"></div></div>
  </div>
  <div id="startBtn" class="b" data-b="start">START</div>
  <div id="btnZone">
    <div id="btns">
      <div class="b by" data-b="p">Y<small>PUNCH</small></div>
      <div class="b bx" data-b="x">X<small>COUNTER</small></div>
      <div class="b bb" data-b="k">B<small>KICK</small></div>
      <div class="b ba" data-b="s">A<small>SPECIAL</small></div>
    </div>
  </div>
</div>
</div>

<div id="rotate">
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="2" width="10" height="16" rx="2"/>
    <path d="M11 15h2"/>
    <path d="M3 13a9 9 0 0 0 7 8"/>
    <path d="M10 21l-2-0.5M10 21l-0.5-2"/>
  </svg>
  <p>Rotate your phone<br>to landscape</p>
  <button id="rotateOk" type="button">CONTINUE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="game.js?v=143"></script>
</body>
</html>
