<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sweet Fighters 2</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<div id="app">
<canvas id="game" width="384" height="216"></canvas>

<div id="touch">
  <div id="stickZone">
    <div id="stick"><div id="knob"></div></div>
  </div>
  <div id="btnZone">
    <div id="btns">
      <div class="b by" data-b="p">Y<small>POING</small></div>
      <div class="b bx" data-b="x">X<small>CONTRE</small></div>
      <div class="b bb" data-b="k">B<small>PIED</small></div>
      <div class="b ba" data-b="s">A<small>SPÉCIAL</small></div>
    </div>
  </div>
</div>
</div>

<div id="rotate">
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="2" width="10" height="16" rx="2"/>
    <path d="M11 15h2"/>
    <path d="M3 13a9 9 0 0 0 7 8"/>
    <path d="M10 21l-2-0.5M10 21l-0.5-2"/>
  </svg>
  <p>Tourne ton téléphone<br>en mode paysage</p>
  <button id="rotateOk" type="button">CONTINUER</button>
</div>

<script src="game.js?v=16"></script>
</body>
</html>
